<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎬 Movie App</h1>
  </header>

  <main class="container">
    <!-- Grid film -->
    <section class="movie-grid">
      <div class="movie-card">
        <img src="https://image.tmdb.org/t/p/w500/rAGiXaUfPzY7CDEyNKUofk3Kw2e.jpg" alt="Iron Man">
        <h4>Iron Man</h4>
      </div>
      <div class="movie-card">
        <img src="https://image.tmdb.org/t/p/w500/hH1j4biEbfkZrj9EYb3n4ycoiR7.jpg" alt="A Man Called Otto">
        <h4>A Man Called Otto</h4>
      </div>
      <div class="movie-card">
        <img src="https://image.tmdb.org/t/p/w500/7IE9KzT2U9K6hZk2zF2Y.jpg" alt="Avatar">
        <h4>Avatar</h4>
      </div>
      <!-- tambahkan film lain sesuai kebutuhan -->
    </section>

    <!-- Sidebar -->
    <aside class="sidebar">
      <h3>Popular Movies</h3>
      <ul>
        <li>
          <img src="https://image.tmdb.org/t/p/w500/7IE9KzT2U9K6hZk2zF2Y.jpg" alt="Avatar">
          <span>Avatar</span>
        </li>
        <li>
          <img src="https://image.tmdb.org/t/p/w500/hH1j4biEbfkZrj9EYb3n4ycoiR7.jpg" alt="A Man Called Otto">
          <span>A Man Called Otto</span>
        </li>
        <li>
          <img src="https://image.tmdb.org/t/p/w500/rAGiXaUfPzY7CDEyNKUofk3Kw2e.jpg" alt="Iron Man">
          <span>Iron Man</span>
        </li>
        <!-- tambahkan list lain sesuai kebutuhan -->
      </ul>
    </aside>
  </main>
</body>
</html>
